<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48 32x32" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08090A" />

    <!-- Google Site Name & Canonical Tags -->
    <meta name="application-name" content="Peel UI" />
    <meta property="og:site_name" content="Peel UI" />
    <link rel="canonical" href="https://peel-ui.vercel.app/" id="canonical-link" />

    <!-- Primary Meta Tags -->
    <title>Peel UI — Tactile React &amp; Tailwind Primitives</title>
    <meta name="title" content="Peel UI — Tactile React &amp; Tailwind Primitives" />
    <meta
      name="description"
      content="Open-source registry of 120fps tactile React primitives crafted with Motion, GSAP, and Tailwind CSS. Copy-paste or install via shadcn CLI."
    />
    <meta
      name="keywords"
      content="Peel UI, React components, Tailwind CSS, Framer Motion, GSAP, shadcn registry, tactile UI, design engineering, open source UI library"
    />
    <meta name="author" content="Sumit Singh (@killersumit)" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://peel-ui.vercel.app/" />
    <meta property="og:site_name" content="Peel UI" />
    <meta property="og:title" content="Peel UI — Tactile React &amp; Tailwind Primitives" />
    <meta
      property="og:description"
      content="Open-source registry of 120fps tactile React primitives crafted with Motion, GSAP, and Tailwind CSS. Copy-paste or install via shadcn CLI."
    />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:creator" content="@Sumit1476136" />
    <meta name="twitter:title" content="Peel UI — Tactile React &amp; Tailwind Primitives" />
    <meta
      name="twitter:description"
      content="Open-source registry of 120fps tactile React primitives crafted with Motion, GSAP, and Tailwind CSS. Copy-paste or install via shadcn CLI."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Preconnect Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- JSON-LD Structured Data: Google Site Names & SoftwareSourceCode -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Peel UI",
        "alternateName": ["PeelUI", "peel-ui", "peel-ui.vercel.app"],
        "url": "https://peel-ui.vercel.app/"
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareSourceCode",
        "name": "Peel UI",
        "codeRepository": "https://github.com/killersumit/peel-ui",

        "programmingLanguage": ["TypeScript", "React", "Tailwind CSS"],
        "author": {
          "@type": "Person",
          "name": "Sumit Singh",
          "url": "https://x.com/Sumit1476136"
        }
      }
    </script>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
